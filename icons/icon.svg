<?xml version="1.0" encoding="UTF-8"?>
<!--
  Weissware Cloud - Plugin-Symbol

  Hausstandard: runde Scheibe in LoxBerry-Gruen #6dac20, Motiv am echten
  Gegenstand orientiert. Bewusst KEINE fremde Wortmarke und kein Logo.
  Gezeigt wird die Front einer Waschmaschine mit Bullauge, Blende und zwei
  Knoepfen; die drei Wellen im Fenster stehen fuer das laufende Programm.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <circle cx="64" cy="64" r="64" fill="#6dac20"/>

  <!-- Gehaeuse -->
  <rect x="26" y="22" width="76" height="84" rx="8" fill="#ffffff"/>

  <!-- Blende oben -->
  <rect x="26" y="22" width="76" height="18" rx="8" fill="#ffffff"/>
  <line x1="26" y1="40" x2="102" y2="40" stroke="#6dac20" stroke-width="3"/>
  <circle cx="88" cy="31" r="4" fill="#6dac20"/>
  <rect x="36" y="28" width="30" height="6" rx="3" fill="#6dac20"/>

  <!-- Bullauge -->
  <circle cx="64" cy="72" r="26" fill="#6dac20"/>
  <circle cx="64" cy="72" r="20" fill="#ffffff"/>

  <!-- Wellen im Fenster: das Programm laeuft -->
  <g fill="none" stroke="#6dac20" stroke-width="4" stroke-linecap="round">
    <path d="M 48 70 q 5 -6 10 0 q 5 6 10 0 q 5 -6 10 0"/>
    <path d="M 50 80 q 4.7 -6 9.3 0 q 4.7 6 9.3 0 q 3 -4 5.4 -1.5"/>
  </g>
</svg>
