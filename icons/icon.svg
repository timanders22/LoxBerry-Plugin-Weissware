<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%" fx="35%" fy="35%">
      <stop offset="0%" stop-color="#7dc424" />
      <stop offset="65%" stop-color="#6dac20" />
      <stop offset="100%" stop-color="#568819" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Badge Ring -->
  <circle cx="256" cy="256" r="246" fill="url(#bg-grad)" />
  <circle cx="256" cy="256" r="232" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3" />

  <g filter="url(#shadow)" fill="#ffffff">
    <!-- 2x2 GRID OF EQUAL-SIZED HOUSEHOLD APPLIANCES (WEIẞE WARE) -->

    <!-- TOP-LEFT: WASHING MACHINE (Waschmaschine) -->
    <g transform="translate(130, 80)">
      <rect x="0" y="0" width="100" height="100" rx="12" fill="#ffffff" />
      <rect x="10" y="10" width="80" height="18" rx="4" fill="#6dac20" />
      <circle cx="22" cy="19" r="4" fill="#ffffff" />
      <circle cx="34" cy="19" r="3" fill="#ffffff" />
      <rect x="62" y="15" width="20" height="8" rx="2" fill="#ffffff" />
      <circle cx="50" cy="58" r="28" fill="#6dac20" />
      <circle cx="50" cy="58" r="20" fill="#ffffff" />
      <path d="M 34 60 Q 42 54 50 60 Q 58 66 66 60 L 66 72 Q 58 72 50 72 Q 42 72 34 72 Z" fill="#6dac20" />
    </g>

    <!-- TOP-RIGHT: FRIDGE / FREEZER (Kühlschrank) -->
    <g transform="translate(282, 80)">
      <rect x="0" y="0" width="100" height="100" rx="12" fill="#ffffff" />
      <rect x="6" y="44" width="88" height="5" fill="#6dac20" />
      <rect x="12" y="14" width="6" height="22" rx="2" fill="#6dac20" />
      <rect x="12" y="56" width="6" height="22" rx="2" fill="#6dac20" />
      <rect x="60" y="16" width="26" height="14" rx="3" fill="#6dac20" />
      <circle cx="68" cy="23" r="2" fill="#ffffff" />
      <rect x="74" y="21" width="8" height="4" fill="#ffffff" />
    </g>

    <!-- BOTTOM-LEFT: OVEN / STOVE (Herd / Backofen) -->
    <g transform="translate(130, 200)">
      <rect x="0" y="0" width="100" height="100" rx="12" fill="#ffffff" />
      <rect x="8" y="8" width="84" height="18" rx="4" fill="#6dac20" />
      <circle cx="20" cy="17" r="4" fill="#ffffff" />
      <circle cx="34" cy="17" r="4" fill="#ffffff" />
      <circle cx="48" cy="17" r="4" fill="#ffffff" />
      <circle cx="62" cy="17" r="4" fill="#ffffff" />
      <rect x="74" y="13" width="12" height="8" rx="2" fill="#ffffff" />
      <rect x="12" y="32" width="76" height="48" rx="6" fill="#6dac20" />
      <rect x="22" y="40" width="56" height="32" rx="4" fill="#ffffff" opacity="0.3" />
      <rect x="22" y="86" width="56" height="6" rx="3" fill="#6dac20" />
    </g>

    <!-- BOTTOM-RIGHT: DISHWASHER / DRYER (Spülmaschine / Trockner) -->
    <g transform="translate(282, 200)">
      <rect x="0" y="0" width="100" height="100" rx="12" fill="#ffffff" />
      <rect x="10" y="10" width="80" height="18" rx="4" fill="#6dac20" />
      <circle cx="20" cy="19" r="4" fill="#ffffff" />
      <rect x="32" y="15" width="24" height="8" rx="2" fill="#ffffff" />
      <circle cx="68" cy="19" r="3" fill="#ffffff" />
      <circle cx="78" cy="19" r="3" fill="#ffffff" />
      <rect x="10" y="34" width="80" height="56" rx="6" fill="#6dac20" />
      <rect x="18" y="42" width="64" height="40" rx="4" fill="#ffffff" fill-opacity="0.15" />
      <rect x="34" y="48" width="32" height="6" rx="3" fill="#ffffff" />
    </g>

    <!-- Dashed Line -->
    <path d="M 150 345 L 362 345" stroke="#ffffff" stroke-width="4" stroke-dasharray="6 8" opacity="0.8" />
  </g>

  <!-- Typography -->
  <text x="256" y="388" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-weight="900" font-size="29" letter-spacing="0.5">Weiße Ware</text>
  <text x="256" y="424" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-weight="bold" font-size="20" letter-spacing="3">LOXBERRY</text>
</svg>
