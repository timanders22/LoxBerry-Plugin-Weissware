[HILFE]
K01 = "White goods cloud"
K02 = "Connects networked household appliances of three ecosystems to Loxone and brings them onto <b>one common model</b>: state, remaining time, progress, door, remote start release, consumption. To the Miniserver a Miele dishwasher then looks exactly like a Bosch washing machine."
K03 = "What you need"
K04 = "Home Connect and Miele only answer registered applications. So you need a <b>free developer account</b> with each and a client ID from it:"
K05 = "<b>Home Connect:</b> developer.home-connect.com → <i>Applications</i> → a new application using the <b>device flow</b>. That is the only one that works without a screen on the device: you get a code, type it into any browser, done."
K06 = "<b>Miele:</b> developer.miele.com → <i>Get involved</i>. Miele offers no procedure for screenless devices; the sign-in runs through the browser and the returned code is pasted in by hand. <i>http://localhost</i> is enough as the redirect address — it does not have to be reachable."
K07 = "<b>SmartThings:</b> just a personal access token."
K08 = "The caveat about SmartThings"
K09 = "On <b>30.12.2024 Samsung shortened the lifetime of newly issued personal access tokens to 24 hours</b> and lowered the rate limits. For continuous operation Samsung requires a registered application with a webhook reachable from outside — which a LoxBerry behind a router cannot readily provide. In practice this means: <b>the token has to be renewed daily.</b> If you do not want to live with that, leave SmartThings switched off. Anyone holding a token issued before 30.12.2024 is not affected."
K10 = "Two intervals instead of one"
K11 = "That is the actual reason for this plugin. A fixed polling cycle is either too slow for a usable remaining time or too fast for the rate limits. Here there is a wide interval while nothing is running and a tight one as soon as an appliance is working — the switch happens by itself. The lower limit is 60 seconds: Home Connect explicitly names frequent polling in its best practices as the most common cause of HTTP 429."
K12 = "Remote start: the safeguard that cannot be argued away"
K13 = "No provider lets a programme be started remotely unless the remote start release has been given <b>on the appliance itself</b> — the <i>remote start</i> button on Home Connect, <i>MobileStart</i> on Miele. The release usually expires after the programme. The plugin shows it and refuses a start without it on its own, rather than running into an error message from the provider."
K14 = "In addition a programme has to be selected on the appliance if you start without a programme key. That is the normal case: load the laundry, select the programme, press remote start — and Loxone presses start when the sun is shining."
K15 = "How to proceed"
K16 = "<b>Settings:</b> switch on the providers, enter the credentials, save."
K17 = "<b>Sign-in:</b> Home Connect by code, Miele through the browser. After that the service keeps itself signed in."
K18 = "<b>Start the service</b> and wait for one interval."
K19 = "<b>Test:</b> the self-check tells you line by line whether it holds."
K20 = "<b>MQTT:</b> enter the subscription in the MQTT gateway. Without that entry nothing arrives at the Miniserver. <b>This applies to MQTT&#8209;gateway&nbsp;V1.</b> From version&nbsp;2 the topic group appears in the subscriptions by itself; there is nothing to enter then."
K21 = "<b>Loxone integration:</b> step by step, with a complete list of blocks for the PV surplus case."
K22 = "What has not been tested"
K23 = "This plugin was built <b>without developer accounts and without appliances</b>. Endpoints and data shapes come from the developer documentation, not from a measurement. What is untested is therefore whether the sign-in succeeds, whether the field names match and whether the writing commands work. If a value stays empty, the <i>View raw data as JSON</i> button on the <i>Test</i> tab shows what the service actually received."
K24 = "Basis"
K25 = "The plugin talks to the interfaces itself and needs only the library <i>requests</i> for that. It is not affiliated with any of the three manufacturers; all three can change their interfaces at any time."
K26 = "<b>Home Connect</b>"
K27 = "Bosch, Siemens, Neff, Gaggenau, Constructa"
K28 = "<b>Miele</b>"
K29 = "Miele@home through the third-party API"
K30 = "<b>SmartThings</b>"
K31 = "Samsung — with reservations, see below"
