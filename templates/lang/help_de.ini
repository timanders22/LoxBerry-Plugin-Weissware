; Hilfetexte, deutsch. Gehoert zu templates/help/help.html.
; LBWeb::gethelp() leitet den Namen dieser Datei aus dem Namen der
; Hilfedatei ab und sucht sie in templates/lang/ - nicht neben der
; Hilfe. Jeder Wert steht in doppelten Anfuehrungszeichen und enthaelt
; selbst keine; Auszeichnung bleibt roh, die Hilfe wird nicht
; maskiert ausgegeben.

[HILFE]
K01 = "Weissware Cloud"
K02 = "Bindet vernetzte Hausgeräte dreier Ökosysteme an Loxone an und bringt sie auf <b>ein gemeinsames Modell</b>: Zustand, Restlaufzeit, Fortschritt, Tür, Fernstart-Freigabe, Verbrauch. Für den Miniserver sieht ein Miele-Geschirrspüler danach genauso aus wie eine Bosch-Waschmaschine."
K03 = "Was Sie brauchen"
K04 = "Home Connect und Miele antworten nur registrierten Anwendungen. Sie brauchen also je ein <b>kostenloses Entwicklerkonto</b> und daraus eine Client-ID:"
K05 = "<b>Home Connect:</b> developer.home-connect.com → <i>Applications</i> → neue Anwendung mit dem Verfahren <b>Device Flow</b>. Das ist das einzige, das ohne Bildschirm am Gerät auskommt: Sie bekommen einen Code, tippen ihn in einem beliebigen Browser ein, fertig."
K06 = "<b>Miele:</b> developer.miele.com → <i>Get involved</i>. Miele bietet kein Verfahren für bildschirmlose Geräte an; die Anmeldung läuft über den Browser, und der Rückgabecode wird von Hand eingefügt. Als Weiterleitungsadresse genügt <i>http://localhost</i> — sie muss nicht erreichbar sein."
K07 = "<b>SmartThings:</b> nur ein Personal Access Token."
K08 = "Der Vorbehalt zu SmartThings"
K09 = "Samsung hat die Lebensdauer neu ausgestellter Personal Access Tokens am <b>30.12.2024 auf 24 Stunden</b> verkürzt und die Ratengrenzen gesenkt. Für Dauerbetrieb verlangt Samsung eine registrierte Anwendung mit einem von außen erreichbaren Webhook — das kann ein LoxBerry hinter einem Router nicht ohne Weiteres. Praktisch heißt das: <b>das Token muss täglich erneuert werden.</b> Wer damit nicht leben will, lässt SmartThings aus. Wer ein Token von vor dem 30.12.2024 hat, ist nicht betroffen."
K10 = "Zwei Takte statt einem"
K11 = "Das ist der eigentliche Grund für dieses Plugin. Ein starrer Abfragezyklus ist entweder zu langsam für eine brauchbare Restzeit oder zu schnell für die Ratengrenzen. Hier gibt es einen weiten Takt, solange nichts läuft, und einen engen, sobald ein Gerät arbeitet — umgeschaltet wird von selbst. Die Untergrenze liegt bei 60 Sekunden: Home Connect nennt häufiges Abfragen in seinen Best Practices ausdrücklich als häufigste Ursache für HTTP 429."
K12 = "Fernstart: die Sicherung, die nicht wegzudiskutieren ist"
K13 = "Kein Anbieter lässt ein Programm aus der Ferne starten, solange nicht <b>am Gerät selbst</b> die Fernstart-Freigabe gegeben wurde — bei Home Connect die Taste <i>Fernstart</i>, bei Miele <i>MobileStart</i>. Die Freigabe erlischt meist nach dem Programm. Das Plugin zeigt sie an und weist einen Start ohne Freigabe von sich aus ab, statt in eine Fehlermeldung des Anbieters zu laufen."
K14 = "Außerdem muss am Gerät ein Programm gewählt sein, wenn Sie ohne Programmschlüssel starten. Das ist der Regelfall: Wäsche einfüllen, Programm wählen, Fernstart drücken — und Loxone drückt auf Start, wenn die Sonne scheint."
K15 = "So gehen Sie vor"
K16 = "<b>Einstellungen:</b> Anbieter einschalten, Zugangsdaten eintragen, speichern."
K17 = "<b>Anmeldung:</b> Home Connect über Code, Miele über Browser. Danach hält sich der Dienst selbst angemeldet."
K18 = "<b>Dienst starten</b>, eine Taktlänge abwarten."
K19 = "<b>Test:</b> Die Selbstprüfung sagt Zeile für Zeile, ob es trägt."
K20 = "<b>MQTT:</b> Das Abo im MQTT-Gateway eintragen. Ohne diesen Eintrag kommt am Miniserver nichts an. <b>Gilt für MQTT&#8209;Gateway&nbsp;V1.</b> Ab Fassung&nbsp;2 erscheint die Themengruppe von selbst in den Subscriptions; einzutragen ist dann nichts."
K21 = "<b>Einbindung in Loxone:</b> Schritt für Schritt, mit drei Seiten aus dem Musterprojekt (Gerät überwachen, PV-Start, Steuerung und Verbrauch) samt Bildern und Anleitung."
K22 = "Was ungeprüft ist"
K23 = "Dieses Plugin wurde <b>ohne Entwicklerkonten und ohne Geräte</b> gebaut. Endpunkte und Datenformen stammen aus den Entwicklerdokumentationen, nicht aus einer Messung. Ungeprüft ist deshalb, ob die Anmeldung gelingt, ob die Feldnamen passen und ob die schreibenden Befehle wirken. Bleibt ein Wert leer, zeigt der Knopf <i>Rohdaten als JSON ansehen</i> im Reiter <i>Test</i>, was der Dienst tatsächlich bekommen hat."
K24 = "Grundlage"
K25 = "Das Plugin spricht die Schnittstellen selbst an und braucht dafür nur die Bibliothek <i>requests</i>. Es ist mit keinem der drei Hersteller verbunden; alle drei können ihre Schnittstellen jederzeit ändern."
K26 = "<b>Home Connect</b>"
K27 = "Bosch, Siemens, Neff, Gaggenau, Constructa"
K28 = "<b>Miele</b>"
K29 = "Miele@home über die 3rd-Party-API"
K30 = "<b>SmartThings</b>"
K31 = "Samsung — mit Vorbehalt, siehe unten"
K32 = "Was OK heißt"
K33 = "<b>OK=0</b>, sobald der letzte erfolgreiche Abruf mehr als dreimal den Ruhetakt zurückliegt (ALTER steht unverändert daneben) oder sein Zeitpunkt in der Zukunft liegt. Schweigt bei mehreren Anbietern einer, bleiben seine Geräte mit den zuletzt gemessenen Werten und OK=0 stehen; über MQTT geht dafür je Gerät <i>geraetN/ok</i> = 0 hinaus. Ein Gerät, das sein Anbieter als getrennt führt (VERBUNDEN=0, etwa ohne WLAN), behält auf beiden Wegen seine zuletzt gemessenen Zustände; ein Strich steht nur, wenn es nie einen Wert gab. Ohne je einen gemessenen Stand antwortet der Endpunkt mit HTTP 503 und GRUND=KEINE_DATEN, für ein Gerät, das der Anbieter nicht mehr führt, mit GRUND=GERAET_ENTFERNT. Schaltende Befehle verlangen <i>geraet=</i>; <i>ein</i> und <i>aus</i> mit demselben Wert binnen 60 Sekunden werden nicht noch einmal gesendet (UNVERAENDERT=1)."
K34 = "Ansage über Alexa oder Google-Lautsprecher"
K35 = "Neben Music Server, MusicServer4Home und eigener Vorlage gibt es zwei Ausgabearten über andere Plugins dieses LoxBerry: <b>Alexa-NG</b> (Amazon Echo) und <b>Google-Lautsprecher</b> über <b>Chromecast 4 Lox NG</b> (ab 1.3.15). Beide sind ab Werk nicht gewählt. In jenem Plugin die Sprachausgabe einrichten und dessen Sprechtoken hier eintragen; ein leeres Gerät heißt Standardgerät. Das Token steht nie in der Sicherung und nie im Protokoll, vom Ansagetext nur seine Länge. Fällt das Plugin aus, entfällt die Ansage – es wird nicht auf einen anderen Lautsprecher ausgewichen. Die Testansage im Reiter Test zeigt die Antwortzeile."
K36 = "Startlogik (Automatik)"
K37 = "Je Gerät anhakbar, ab Werk aus. Gestartet wird nur mit Fernstart-Freigabe am Gerät, einmal je Freigabe, zwischen Fensterbeginn (8 Uhr) und Frist (20 Uhr): nach Strompreis in einer der vier günstigsten Stunden bis zur Frist (haus/strompreis vom Spotpreis-Plugin) oder nach Speicher ab 60 % und nicht entladend (haus/speicher). Schweigt die Quelle, startet das Gerät an der Frist. Je Gerät entweder diese Startlogik oder die Loxone-Seite „PV-Start“ – den PV-Überschuss kennt nur Loxone."
K38 = "Gateway V2 und Befehlsbrücke"
K39 = "Werte kommen über das MQTT-Gateway V2: Datenpunkte im Reiter MQTT anhaken, Lebenszeichen <i>zaehler</i> als Noncached. Befehle über die Befehlsbrücke (ab Werk aus; Vorlage im Reiter MQTT). Der HTTP-Endpunkt ist bei einer Neuinstallation aus und bleibt beim Update an. Ein Messwert ohne Aussage kommt über MQTT als −1 an (Temperatur −999)."
K40 = "<b>Mehrere Lautsprecher gleichzeitig</b> (seit 0.9.44, Sprachmodul 1.2.1): Unter der Ausgabeart (jetzt „Ziel 1“) steht die Tabelle <i>Weitere Ausgabeziele (gleichzeitig)</i> – bis zu 6 Ziele insgesamt, zum Beispiel Loxone Music Server, Google-Lautsprecher (Chromecast 4 Lox NG) und Amazon Echo (Alexa-NG). Jede Ansage geht gleichzeitig an Ziel 1 und an jedes eingeschaltete Ziel der Tabelle; scheitert eines, sprechen die anderen trotzdem, und die Ansage gilt als gesendet, sobald eines gesprochen hat (Protokoll und Reiter Test nennen jedes Ziel). Ist Ziel 1 aus, spricht keines; mit dem Original-Audioserver als Ziel 1 gehen keine weiteren Ziele. Neues Ziel: die leere Zeile ausfüllen und speichern. Mehrere Zonen desselben Music Servers bzw. mehrere Echos gehören in EIN Ziel (Zonenliste, Kommaliste, gruppe:&lt;Name&gt;). Das Sprechtoken steht einmal oben und gilt für alle Ziele dieser Art. Im Reiter Test spricht <i>Testansage</i> an alle Ziele, <i>Testansage an Ziel n</i> nur an dieses. Vor einem Zurückgehen auf eine Fassung vor 0.9.44 die weiteren Ziele entfernen – ältere Fassungen kennen die Liste nicht und fielen beim Laden auf die Werkseinstellung der Sprachausgabe zurück."
