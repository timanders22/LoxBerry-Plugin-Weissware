[LOX]
EINLEITUNG = "Neun Schritte. Wer sie von oben nach unten abarbeitet, hat am Ende eine funktionierende Einbindung — einschließlich der kompletten Baustein-Liste in Schritt 8."
FEHLER_VORLAGE = "Die angeforderte Vorlage gibt es nicht. Es wurde nichts erzeugt."
H_TITEL = "Einbindung in Loxone"
K_TOKEN_NEU = "Neues Token würfeln"
K_VORLAGE_BEFEHLE = "Befehle als virtuelle Ausgänge"
K_VORLAGE_MQTT = "MQTT-Eingänge als Vorlage"
K_VORLAGE_STATUS = "Status-Eingänge als Vorlage"
K_VORLAGE_VERBRAUCH = "Verbrauchs-Eingänge als Vorlage"
MEHRERE_GERAETE = "Mehrere Geräte — je Gerät ein eigener virtueller Eingang:"
MQTT_VORLAGE_HINWEIS = "Diese Datei legt nur die Eingänge an; die Werte kommen danach vom MQTT-Gateway, nicht über die eingetragene Adresse. Ohne das Abo im Gateway kommt am Miniserver nichts an."
S1_TEXT = "Es gibt zwei Wege, und <b>MQTT ist der Regelweg</b>. Der Gateway erzeugt die Namen der virtuellen Eingänge selbst; in Loxone genügt dann ein passend benannter virtueller Eingang. Der Weg über HTTP verlangt je Wert eine eigene Befehlserkennung, dafür kommt alles in <b>einem</b> Abruf und man sieht im Browser sofort, was ankommt. Wer neu anfängt, nimmt MQTT; wer nur wenige Werte braucht, fährt mit HTTP schneller ans Ziel. Beides gleichzeitig geht auch."
S1_TITEL = "Schritt 1: Weg festlegen"
S2_TEXT = "Nur nötig, wenn Sie den MQTT-Weg gehen. Die Themengruppe dieses Plugins lautet:"
S2_TITEL = "Schritt 2: Das Abo im MQTT-Gateway"
S3_BEFEHLE = "Darunter je Wert eine <i>Befehlserkennung</i>. Die Vorlage unten legt alle auf einmal an — das ist weniger mühsam und weniger fehleranfällig als das Abtippen."
S3_STRICH = "<b>Ein Strich statt einer Zahl bedeutet: dieser Wert liegt nicht vor.</b> Es wird bewusst keine 0 gesendet — eine 0 wäre eine stille Falschaussage. Loxone behält in diesem Fall den letzten gültigen Wert. Genau deshalb braucht es die Ausfallerkennung aus Schritt 7."
S3_TEXT = "In Loxone Config: <i>Virtueller Eingang → Virtueller HTTP-Eingang</i>. Adresse und Zyklus:"
S3_TITEL = "Schritt 3: Virtuellen HTTP-Eingang für die Hauptwerte anlegen"
S4_LEER = "<b>Nicht jeder Anbieter liefert jeden Wert.</b> Home Connect meldet weder Energie- noch Wasserverbrauch; SmartThings meldet keinen Fortschritt in Prozent; Miele liefert beides, aber nur bei Geräten mit EcoFeedback. Was fehlt, ist ein Strich — keine 0."
S4_TEXT = "Ein weiterer virtueller HTTP-Eingang nach demselben Muster wie Schritt 3, mit der Aktion <span class='sm-mono'>verbrauch</span>. Ein Zyklus von 300 Sekunden genügt."
S4_TITEL = "Schritt 4: Eingang für Verbrauch und Programmwerte"
S5_TEXT = "Nur nötig, wenn Loxone etwas auslösen soll. In Loxone Config einen <i>Virtuellen Ausgang</i> mit der unten stehenden Adresse anlegen und darunter je Befehl einen <i>Virtuellen Ausgang Befehl</i>. Im Befehlstext steht <span class='sm-mono'>&lt;v&gt;</span> für den übergebenen Wert."
S5_TITEL = "Schritt 5: Befehle senden (virtueller Ausgang)"
S5_WARNUNG = "Zwei Dinge, die man vorher wissen sollte. <b>Erstens:</b> Schreibende Befehle sind ab Werk gesperrt und müssen im Reiter Einstellungen erst freigegeben werden. <b>Zweitens:</b> Eine Antwort mit <span class='sm-mono'>OK=1</span> heißt, dass der Anbieter die Anfrage angenommen hat. Ob das Gerät anläuft, zeigt erst der nächste Abruf — wer sicher sein will, wertet <span class='sm-mono'>LAEUFT</span> aus und nicht die Antwort auf den Befehl."
S6_TEXT = "Der Endpunkt liegt im unangemeldeten Bereich, damit Loxone ihn ohne Zugangsdaten erreicht. Geschützt ist er durch dieses Token. Es steckt in jeder Adresse, die Sie im Miniserver eintragen — <b>ein neues Token macht alle diese Adressen auf einen Schlag ungültig</b> und muss überall nachgetragen werden. Würfeln Sie es also nur neu, wenn es tatsächlich in falsche Hände geraten ist."
S6_TITEL = "Schritt 6: Das Token"
S7_TEXT = "Schweigt ein Anbieter, behalten die virtuellen Eingänge ihren letzten Wert. In der App sieht dann alles normal aus, obwohl seit Stunden nichts mehr angekommen ist. Deshalb wird der Wert <span class='sm-mono'>ALTER</span> mitgeführt: er sagt, wie alt das Abbild in Sekunden ist. Die Schwelle dafür gehört <b>deutlich über den Ruhetakt</b> — bei 300 Sekunden sind 1200 Sekunden ein brauchbarer Wert."
S7_TITEL = "Schritt 7: Ausfallerkennung"
S8_ERLAEUTERUNG = "<p><b>Zu #13 bis #16 — der eigentliche Zweck:</b> Der Schwellwertschalter #13 vergleicht den PV-Überschuss mit dem, was die Maschine zieht (Waschmaschine etwa 2000 W, Geschirrspüler etwa 2200 W in der Aufheizphase). Die UND-Verknüpfung #14 lässt den Start nur zu, wenn zugleich die Fernstart-Freigabe vorliegt und das Gerät nicht schon läuft. Die Einschaltverzögerung #15 von zehn Minuten verhindert, dass eine vorbeiziehende Wolke ein Waschprogramm auslöst.</p><p><b>Zu #17 und #18:</b> Beide freiwillig. Wer einen Hausakku hat, will nicht waschen, solange der leer ist; wer einen dynamischen Tarif hat, will notfalls auch ohne Sonne waschen, wenn der Strom billig ist. Beide Bausteine kommen aus anderen Plugins — dieses liefert sie nicht.</p><p><b>Zu #21 und #22:</b> Der Benachrichtigungs-Baustein sendet nur beim Wechsel von Aus auf Ein — genau richtig für „Geschirrspüler ist fertig“. Niemals mehrere Geräte direkt an seinen Eingang: eine dauerhaft aktive Quelle verschluckt alle übrigen. Erst über ODER zusammenführen.</p><p><b>Zu #25:</b> Die Schwelle liegt beim Vierfachen des Ruhetakts. Wer sie knapper setzt, bekommt bei jedem einzelnen verpassten Durchlauf eine Meldung.</p><p><b>Zu #30:</b> Ohne Fernstart-Freigabe weist der Anbieter jeden Start ab. Der Befehl gar nicht erst zu senden spart eine Fehlermeldung und eine Anfrage. <b>Loxone-Zeitrechnung:</b> Sekunden seit dem 01.01.2009. Liefert ein Zeit-Baustein Unix-Zeit (Werte um 1,23 Milliarden), sind 1230768000 abzuziehen.</p>"
S8_TEXT = "Jede Zeile ein Baustein. Loxone Config führt alle in der Baustein-Suche (Taste F5). Die Zeilen 1 bis 12 sind die virtuellen Eingänge aus Schritt 3 und 4. Nachgebaut wird der Fall, um den es den meisten geht: <b>Waschen, wenn die Sonne scheint</b> — und eine Meldung, wenn das Programm fertig ist."
S8_TITEL = "Schritt 8: Komplette Baustein-Liste zum 1:1-Nachbauen"
S9_TEXT = "Diese drei Adressen im Browser aufrufen. Die erste muss Werte liefern, die beiden anderen müssen <b>abgewiesen</b> werden — wenn nicht, ist etwas an der Absicherung falsch."
S9_TITEL = "Schritt 9: Gegenprobe"
