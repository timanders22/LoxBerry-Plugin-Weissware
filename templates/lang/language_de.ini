[LOX]
EINLEITUNG = "Neun Schritte. Wer sie von oben nach unten abarbeitet, hat am Ende eine funktionierende Einbindung &mdash; einschlie&szlig;lich der kompletten Baustein-Liste in Schritt 8."
H_TITEL = "Einbindung in Loxone"
K_TOKEN_NEU = "Neues Token würfeln"
K_VORLAGE = "Vorlage für Loxone Config herunterladen"
MEHRERE_GERAETE = "Mehrere Geräte — je Gerät ein eigener virtueller Eingang:"
S1_TEXT = "Es gibt zwei Wege, und <b>MQTT ist der Regelweg</b>. Der Gateway erzeugt die Namen der virtuellen Eing&auml;nge selbst; in Loxone gen&uuml;gt dann ein passend benannter virtueller Eingang. Der Weg &uuml;ber HTTP verlangt je Wert eine eigene Befehlserkennung, daf&uuml;r kommt alles in <b>einem</b> Abruf und man sieht im Browser sofort, was ankommt. Wer neu anf&auml;ngt, nimmt MQTT; wer nur wenige Werte braucht, f&auml;hrt mit HTTP schneller ans Ziel. Beides gleichzeitig geht auch."
S1_TITEL = "Schritt 1: Weg festlegen"
S2_TEXT = "Nur n&ouml;tig, wenn Sie den MQTT-Weg gehen. Unter <i>System &rarr; MQTT Gateway</i> im Abschnitt <i>Subscriptions</i> eintragen:"
S2_TITEL = "Schritt 2: Abo im MQTT-Gateway eintragen"
S2_WARNUNG = "<b>Ohne diesen Eintrag kommt am Miniserver nichts an.</b> Das ist die h&auml;ufigste Fehlerursache &uuml;berhaupt &mdash; das Plugin sendet, aber niemand h&ouml;rt zu."
S3_BEFEHLE = "Darunter je Wert eine <i>Befehlserkennung</i>. Die Vorlage unten legt alle auf einmal an &mdash; das ist weniger m&uuml;hsam und weniger fehleranf&auml;llig als das Abtippen."
S3_STRICH = "<b>Ein Strich statt einer Zahl bedeutet: dieser Wert liegt nicht vor.</b> Es wird bewusst keine 0 gesendet &mdash; eine 0 w&auml;re eine stille Falschaussage. Loxone beh&auml;lt in diesem Fall den letzten g&uuml;ltigen Wert. Genau deshalb braucht es die Ausfallerkennung aus Schritt 7."
S3_TEXT = "In Loxone Config: <i>Virtueller Eingang &rarr; Virtueller HTTP-Eingang</i>. Adresse und Zyklus:"
S3_TITEL = "Schritt 3: Virtuellen HTTP-Eingang für die Hauptwerte anlegen"
S4_LEER = "<b>Nicht jeder Anbieter liefert jeden Wert.</b> Home Connect meldet weder Energie- noch Wasserverbrauch; SmartThings meldet keinen Fortschritt in Prozent; Miele liefert beides, aber nur bei Ger&auml;ten mit EcoFeedback. Was fehlt, ist ein Strich &mdash; keine 0."
S4_TEXT = "Ein weiterer virtueller HTTP-Eingang nach demselben Muster wie Schritt 3, mit der Aktion <span class='sm-mono'>verbrauch</span>. Ein Zyklus von 300 Sekunden gen&uuml;gt."
S4_TITEL = "Schritt 4: Eingang für Verbrauch und Programmwerte"
S5_TEXT = "Nur n&ouml;tig, wenn Loxone etwas ausl&ouml;sen soll. In Loxone Config einen <i>Virtuellen Ausgang</i> mit der unten stehenden Adresse anlegen und darunter je Befehl einen <i>Virtuellen Ausgang Befehl</i>. Im Befehlstext steht <span class='sm-mono'>&lt;v&gt;</span> f&uuml;r den &uuml;bergebenen Wert."
S5_TITEL = "Schritt 5: Befehle senden (virtueller Ausgang)"
S5_WARNUNG = "Zwei Dinge, die man vorher wissen sollte. <b>Erstens:</b> Schreibende Befehle sind ab Werk gesperrt und m&uuml;ssen im Reiter Einstellungen erst freigegeben werden. <b>Zweitens:</b> Eine Antwort mit <span class='sm-mono'>OK=1</span> hei&szlig;t, dass der Anbieter die Anfrage angenommen hat. Ob das Ger&auml;t anl&auml;uft, zeigt erst der n&auml;chste Abruf &mdash; wer sicher sein will, wertet <span class='sm-mono'>LAEUFT</span> aus und nicht die Antwort auf den Befehl."
S6_TEXT = "Der Endpunkt liegt im unangemeldeten Bereich, damit Loxone ihn ohne Zugangsdaten erreicht. Gesch&uuml;tzt ist er durch dieses Token. Es steckt in jeder Adresse, die Sie im Miniserver eintragen &mdash; <b>ein neues Token macht alle diese Adressen auf einen Schlag ung&uuml;ltig</b> und muss &uuml;berall nachgetragen werden. W&uuml;rfeln Sie es also nur neu, wenn es tats&auml;chlich in falsche H&auml;nde geraten ist."
S6_TITEL = "Schritt 6: Das Token"
S7_TEXT = "Schweigt ein Anbieter, behalten die virtuellen Eing&auml;nge ihren letzten Wert. In der App sieht dann alles normal aus, obwohl seit Stunden nichts mehr angekommen ist. Deshalb wird der Wert <span class='sm-mono'>ALTER</span> mitgef&uuml;hrt: er sagt, wie alt das Abbild in Sekunden ist. Die Schwelle daf&uuml;r geh&ouml;rt <b>deutlich &uuml;ber den Ruhetakt</b> &mdash; bei 300 Sekunden sind 1200 Sekunden ein brauchbarer Wert."
S7_TITEL = "Schritt 7: Ausfallerkennung"
S8_ERLAEUTERUNG = "<p><b>Zu #13 bis #16 &mdash; der eigentliche Zweck:</b> Der Schwellwertschalter #13 vergleicht den PV-&Uuml;berschuss mit dem, was die Maschine zieht (Waschmaschine etwa 2000 W, Geschirrsp&uuml;ler etwa 2200 W in der Aufheizphase). Die UND-Verkn&uuml;pfung #14 l&auml;sst den Start nur zu, wenn zugleich die Fernstart-Freigabe vorliegt und das Ger&auml;t nicht schon l&auml;uft. Die Einschaltverz&ouml;gerung #15 von zehn Minuten verhindert, dass eine vorbeiziehende Wolke ein Waschprogramm ausl&ouml;st.</p><p><b>Zu #17 und #18:</b> Beide freiwillig. Wer einen Hausakku hat, will nicht waschen, solange der leer ist; wer einen dynamischen Tarif hat, will notfalls auch ohne Sonne waschen, wenn der Strom billig ist. Beide Bausteine kommen aus anderen Plugins &mdash; dieses liefert sie nicht.</p><p><b>Zu #21 und #22:</b> Der Benachrichtigungs-Baustein sendet nur beim Wechsel von Aus auf Ein &mdash; genau richtig f&uuml;r &bdquo;Geschirrsp&uuml;ler ist fertig&ldquo;. Niemals mehrere Ger&auml;te direkt an seinen Eingang: eine dauerhaft aktive Quelle verschluckt alle &uuml;brigen. Erst &uuml;ber ODER zusammenf&uuml;hren.</p><p><b>Zu #25:</b> Die Schwelle liegt beim Vierfachen des Ruhetakts. Wer sie knapper setzt, bekommt bei jedem einzelnen verpassten Durchlauf eine Meldung.</p><p><b>Zu #30:</b> Ohne Fernstart-Freigabe weist der Anbieter jeden Start ab. Der Befehl gar nicht erst zu senden spart eine Fehlermeldung und eine Anfrage. <b>Loxone-Zeitrechnung:</b> Sekunden seit dem 01.01.2009. Liefert ein Zeit-Baustein Unix-Zeit (Werte um 1,23 Milliarden), sind 1230768000 abzuziehen.</p>"
S8_TEXT = "Jede Zeile ein Baustein. Loxone Config f&uuml;hrt alle in der Baustein-Suche (Taste F5). Die Zeilen 1 bis 12 sind die virtuellen Eing&auml;nge aus Schritt 3 und 4. Nachgebaut wird der Fall, um den es den meisten geht: <b>Waschen, wenn die Sonne scheint</b> &mdash; und eine Meldung, wenn das Programm fertig ist."
S8_TITEL = "Schritt 8: Komplette Baustein-Liste zum 1:1-Nachbauen"
