TAKT_ERKLAERUNG = "<b>Der eigentliche Grund f&uuml;r dieses Plugin.</b> Ein starrer Abfragezyklus ist entweder zu langsam f&uuml;r eine brauchbare Restzeit oder zu schnell f&uuml;r die Ratengrenzen des Anbieters. Hier gibt es zwei Takte: einen weiten, solange nichts l&auml;uft, und einen engen, sobald mindestens ein Ger&auml;t arbeitet. Umgeschaltet wird von selbst."
