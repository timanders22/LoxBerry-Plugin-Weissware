UNGEPRUEFT = "Dieses Plugin wurde <b>ohne Entwicklerkonten und ohne Geräte</b> gebaut. Ungeprüft ist deshalb: ob die Anmeldung bei den drei Anbietern gelingt, ob die Feldnamen der Antworten zu der Zuordnung hier passen und ob die schreibenden Befehle am Gerät die erwartete Wirkung haben. Endpunkte und Datenformen stammen aus den Entwicklerdokumentationen, nicht aus einer Messung. Geprüft ist alles übrige: Oberfläche, Endpunkt, Absicherung, Warteschlange, Sprachdateien und die Zuordnung selbst — letztere gegen nachgebaute Antworten in der dokumentierten Form. Deshalb trägt diese Fassung die Nummer 0.9.0 und nicht 1.0.0. Wenn etwas leer bleibt, hilft der Knopf <i>Rohdaten als JSON ansehen</i>: dort steht, was der Dienst tatsächlich bekommen hat."

