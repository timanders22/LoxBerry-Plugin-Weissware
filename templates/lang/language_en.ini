MEHRERE_GERAETE = "Several appliances — one virtual input per appliance:"
MQTT_VORLAGE_HINWEIS = "This file only creates the inputs; the values then come from the MQTT gateway, not over the address entered. Without the subscription in the gateway nothing arrives at the Miniserver."
MUSTERPROJEKT = "The complete project file with all plugin pages and templates: <a href='https://github.com/timanders22/LoxBerry-Plugins-Musterprojekt' target='_blank' rel='noopener'>LoxBerry plugins sample project</a>"
S1_TEXT = "There are two paths. <b>The sample project and the pages in step 8 use HTTP</b>: the templates, the age of the values and the commands only exist there, and you can see in the browser right away what arrives. MQTT is the second path (off by default): the gateway creates the names of the virtual inputs itself and also delivers programme name and state text, but no age. Both paths at once give duplicate inputs."
S1_TITEL = "Step 1: choose the path"
S2_TEXT = "Only needed for the MQTT path. The topic group of this plugin is:"
S2_TITEL = "Step 2: The subscription in the MQTT gateway"
S3_BEFEHLE = "Below it one <i>command recognition</i> per value. The template below creates them all at once — less tedious and less error-prone than typing them."
S3_STRICH = "<b>A dash instead of a number means: this value is not available.</b> No zero is sent on purpose — a zero would be a silent false statement. Loxone keeps the last valid value in that case. That is exactly why the failure detection in step 7 is needed."
S3_TEXT = "In Loxone Config: <i>Virtual input → Virtual HTTP input</i>. Address and polling cycle:"
S3_TITEL = "Step 3: create a virtual HTTP input for the main values"
S4_LEER = "<b>Not every provider supplies every value.</b> Home Connect reports neither energy nor water consumption; SmartThings reports no progress in percent; Miele supplies both, but only for appliances with EcoFeedback. What is missing is a dash — not a zero."
S4_TEXT = "One more virtual HTTP input built like step 3, using the action <span class='sm-mono'>verbrauch</span>. A cycle of 300 seconds is enough."
S4_TITEL = "Step 4: input for consumption and programme values"
S5_TEXT = "Only needed if Loxone should trigger something. In Loxone Config create a <i>virtual output</i> with the address below and one <i>virtual output command</i> per command. In the command text <span class='sm-mono'>&lt;v&gt;</span> stands for the value passed. For automatics and app buttons use the two pulse commands “WW 1 Start (Befehl)” and “WW 1 Abbrechen (Befehl)” of the template – “WW 1 Programm (Befehl)” sends “stop” when it drops and aborts a programme that has just started."
S5_TITEL = "Step 5: sending commands (virtual output)"
S5_WARNUNG = "Three things to know beforehand. <b>First:</b> write commands are disabled by default and must be enabled in the Settings tab. <b>Second:</b> an answer of <span class='sm-mono'>OK=1</span> means the provider accepted the request. Whether the appliance actually starts only shows on the next poll — if you need certainty, evaluate <span class='sm-mono'>LAEUFT</span>, not the answer to the command. <b>Third:</b> every switching command except <span class='sm-mono'>abruf</span> needs <span class='sm-mono'>geraet=</span> — without it the plugin answers <span class='sm-mono'>GRUND=GERAET_FEHLT</span> and switches nothing. <span class='sm-mono'>ein</span> and <span class='sm-mono'>aus</span> with the same value within 60 seconds are not sent again; the answer then carries <span class='sm-mono'>UNVERAENDERT=1</span>."
S6_TEXT = "The endpoint sits in the unauthenticated area so Loxone can reach it without credentials. It is protected by this token. The token is part of every address you enter in the Miniserver — <b>a new token invalidates all of them at once</b> and has to be updated everywhere. So only roll a new one if it has actually leaked."
S6_TITEL = "Step 6: the token"
S7_TEXT = "If a provider goes silent, the virtual inputs keep their last value. Everything looks normal in the app although nothing has arrived for hours. That is why the value <span class='sm-mono'>ALTER</span> is carried along: it states the age of the snapshot in seconds. <span class='sm-mono'>OK</span> drops to 0 after three times the idle interval (15 minutes); if the LoxBerry itself stands still, OK and ALTER freeze as well – only a Value Validator on ALTER notices that (page “Weissware” in step 8)."
S7_TITEL = "Step 7: failure detection"
S8_TEXT = "Three pages from the LoxBerry plugins sample project, built and connected there in Loxone Config. One block per row; Loxone Config lists them all in the block search (key F5). If you only want monitoring, take over the first page alone; “Weissware PV-Start” is the case most people are after: <b>wash when the sun is shining</b>. The names apply to appliance 1 as the templates create them; the template titles are fixed German, also with an English interface."
S8_TITEL = "Step 8: three pages from the sample project to rebuild"
S9_TEXT = "Open these three addresses in a browser. The first must return values, the other two must be <b>rejected</b> — if they are not, something is wrong with the protection."
S9_TITEL = "Step 9: cross-check"
