UNGEPRUEFT = "This plugin was built <b>without developer accounts and without appliances</b>. Unverified is therefore: whether signing in with the three providers succeeds, whether the field names of the responses match the mapping here, and whether the write commands have the expected effect. Endpoints and data shapes come from the developer documentation, not from a measurement. Everything else has been verified: user interface, endpoint, protection, queue, language files and the mapping itself &mdash; the latter against rebuilt responses in the documented shape. That is why this version is numbered 0.9.0 and not 1.0.0. If something stays empty, the button <i>View raw data as JSON</i> helps: it shows what the service actually received."

