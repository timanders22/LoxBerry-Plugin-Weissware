[BAUSTEIN]
HINWEISE_TITEL = "Notes"
S1_H1 = "The fault message comes after 5 minutes at the earliest; “Abruf steht” (LoxBerry off) after 10 minutes plus 5."
S1_H2 = "On no. 17: if the LoxBerry stands still, all inputs keep their last value; only the frozen ALTER gives it away. If you lengthen the polling time on the container, set Tmc to ten times its value."
S1_H3 = "On no. 18, 25 and 27: digital inputs go on without a threshold switch – a threshold switch behind a polled input gives a short pulse at every poll, and a notification behind it then reports every minute."
S1_H4 = "Several appliances: one status template per appliance (“Weissware 2 Status” …) and the same blocks; lead the faults via further ORs (two inputs each) before no. 20 – never several sources directly into one notification."
S1_H5 = "“Fertig” stays until the appliance has been unloaded (door opened); that is why the reminder comes after one hour."
S1_H6 = "A dash from the plugin means “the manufacturer does not deliver this” – the input then keeps its last value."
S1_H7 = "No. 11 (Fernbedienung) and no. 15 (Fertig um) are there as inputs only: not every manufacturer delivers the remote control value, and a status does not show “Fertig um” as a time of day. Programme name and state text only exist over MQTT."
S1_H8 = "The announcement “… ist fertig” over a speaker is made by the plugin itself (tab Settings, off by default) – no block."
S1_SCHRITT1 = "In the plugin tab “%s” log in to the manufacturer (Home Connect, Miele or SmartThings), start the service and wait until the appliance is listed under “%s”. Tab “%s” → “%s”: a line WEISSWARE;OK=1;ZUSTAND=… comes back"
S1_SCHRITT2 = "Tab “%s” → under “Templates for appliance 1” the button “%s”. In Loxone Config: select “Virtual Inputs” in the tree, ribbon “Predefined HTTP devices → Import template…”. Import only ONCE (twice gives duplicate inputs). Fetch it only after the appliance has answered once – then the file only contains what it really delivers."
S1_SCHRITT3 = "Create the page “Weissware”, drag all commands from the container “Weissware 1 Status” (no. 1–15), plus the constant 1."
S1_SCHRITT4 = "Create four notifications (Periphery → Messages → Notification), texts as in the list, drag them onto the page. Each gets exactly one connection."
S1_SCHRITT5 = "Place the remaining blocks via the block search (key F5), parameters as in the list, connect from top to bottom. On the Value Validator no. 17 remove the tick at ‘En’ in the properties window (Config creates En inverted; otherwise constant 1 arrives as 0). Status “WW 1 Gerät”: click “+” four times first (V5–V8); enter the rows of the status blocks in the given order, the one without condition last. “Use in User Interface” on no. 1, 2, 3, 7 and on both status blocks."
S1_SCHRITT6 = "Save and transfer. Check: “Weissware-Zustand” shows “läuft – Werte … s alt”, “WW 1 Gerät” the state of the machine."
S2_H1 = "Without a remote start release on the appliance nothing starts; the release usually expires with the programme and has to be given anew every time. That is why the automatic does not start a second time after the end of the programme."
S2_H2 = "On no. 28 and 29: one pulse per release. “WW 1 Start (Befehl)” has an on command only – “WW 1 Programm (Befehl)” sends “stop” when it drops and would abort the programme that has just started."
S2_H3 = "“Weissware jetzt starten” (push button) starts immediately, also without the automatic – but likewise only with a remote start release."
S2_H4 = "On no. 6: surplus = feed-in plus the charging power of the home battery. Adapt the threshold of 2000 W to your own machine (no. 7); if the house imports electricity, the surplus is 0."
S2_H5 = "A full home battery is a further reason to start – the machine then runs from the battery. With Spotpreis Octopus or Tibber, no. 10 comes from the rank command of that template."
S2_H6 = "No. 1 to 3 are digital inputs and go into the AND chain without a threshold switch."
S2_H7 = "Whether the appliance really starts is shown by “WW 1 Läuft” after the next poll, not by the answer to the command."
S2_SCHRITT1 = "In the plugin tab “%s” set the tick “%s” and save."
S2_SCHRITT2 = "Tab “%s” → “%s”. In Loxone Config: tree “Virtual Outputs” → “Predefined devices → Import template…”. Import only once; the template also carries the commands of the page “Weissware Steuerung und Verbrauch”."
S2_SCHRITT3 = "Provide your own measurements: “Netzleistung (eigene Quelle)” from your own electricity meter (plus = import, minus = feed-in), with a home battery “Ladeleistung Speicher 1 (eigene Quelle)” and “Ladezustand Speicher 1 (Proz) (eigene Quelle)”; with a dynamic tariff the container of the spot price plugin (SPOT_RANK). Whatever you do not have stays free – that reason then simply drops out."
S2_SCHRITT4 = "Create the page “Weissware PV-Start”, drag the blocks of the list or place them via the block search (key F5) and connect them; every AND and OR has two inputs. Create new: the switches no. 14 and 21 and the push button no. 23 as virtual inputs (each with “Use in User Interface” on) and the notification “Meldung Weissware gestartet”. Schedule no. 19: enter ON daily 08:00–20:00. AND no. 26: negate input I2 – click its input point in Config; it then shows a small circle. Status “Weissware-Automatik jetzt”: click “+” four times first (V5–V8)."
S2_SCHRITT5 = "Save, transfer, switch on “Weissware-Automatik” in the app (and, if wanted, “Günstigen Strom zum Waschen nutzen”)."
S2_SCHRITT6 = "This is how washing works: fill the machine, select a programme, press “Remote start” on the appliance, leave. The page starts as soon as there has been enough surplus for 10 minutes (or the home battery is above 60 percent or one of the four cheapest hours is running) – only between 8 and 20 h."
S3_H1 = "“Anhalten” and “Ein/Aus” usually need the remote control release on the appliance; without it the manufacturer cloud rejects them."
S3_H2 = "The switch does not remember what was pressed on the appliance by hand – it shows the last request from Loxone."
S3_H3 = "Home Connect delivers neither energy nor water, SmartThings no water; Miele both only with appliances with EcoFeedback."
S3_H4 = "“WW Dienst OK” and “WW Dienst Alter” from the template “Weissware Dienst” stay in the tree; the page “Weissware” already watches the polling per appliance."
S3_SCHRITT1 = "The command template comes from the page “Weissware PV-Start”, step 2 (do not import it again). Tab “%s” → fetch “%s” and “%s” and import them in Loxone Config: select “Virtual Inputs” in the tree, ribbon “Predefined HTTP devices → Import template…”. The service values apply to all appliances together and are imported only once."
S3_SCHRITT2 = "Create the page “Weissware Steuerung und Verbrauch”, drag the four commands (no. 2, 4, 6, 8) and the inputs, create the four app buttons as virtual inputs (push button or switch as in the list, each with “Use in User Interface” on), connect them. Click “+” once on both status blocks first (V5)."
S3_SCHRITT3 = "Save and transfer. Check: press “Weissware sofort abrufen” – “WW 1 Alter” drops after the next poll."
