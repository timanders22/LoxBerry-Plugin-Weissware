[LOX]
EINLEITUNG = "Nine steps. Work through them from top to bottom and you end up with a working integration &mdash; including the complete block list in step 8."
H_TITEL = "Loxone integration"
K_TOKEN_NEU = "Roll a new token"
K_VORLAGE = "Download template for Loxone Config"
MEHRERE_GERAETE = "Several appliances — one virtual input per appliance:"
S1_TEXT = "There are two paths, and <b>MQTT is the standard one</b>. The gateway creates the names of the virtual inputs itself; in Loxone a matching virtual input is all you need. The HTTP path requires a command recognition per value, but everything arrives in <b>one</b> request and you can see in the browser what comes back. Start with MQTT; if you only need a few values, HTTP gets you there faster. Both at once works too."
S1_TITEL = "Step 1: choose the path"
S2_TEXT = "Only needed for the MQTT path. Under <i>System &rarr; MQTT Gateway</i>, section <i>Subscriptions</i>, add:"
S2_TITEL = "Step 2: add the subscription in the MQTT gateway"
S2_WARNUNG = "<b>Without this entry nothing arrives at the Miniserver.</b> This is by far the most common cause of failure &mdash; the plugin sends, but nobody listens."
S3_BEFEHLE = "Below it one <i>command recognition</i> per value. The template below creates them all at once &mdash; less tedious and less error-prone than typing them."
S3_STRICH = "<b>A dash instead of a number means: this value is not available.</b> No zero is sent on purpose &mdash; a zero would be a silent false statement. Loxone keeps the last valid value in that case. That is exactly why the failure detection in step 7 is needed."
S3_TEXT = "In Loxone Config: <i>Virtual input &rarr; Virtual HTTP input</i>. Address and polling cycle:"
S3_TITEL = "Step 3: create a virtual HTTP input for the main values"
S4_LEER = "<b>Not every provider supplies every value.</b> Home Connect reports neither energy nor water consumption; SmartThings reports no progress in percent; Miele supplies both, but only for appliances with EcoFeedback. What is missing is a dash &mdash; not a zero."
S4_TEXT = "One more virtual HTTP input built like step 3, using the action <span class='sm-mono'>verbrauch</span>. A cycle of 300 seconds is enough."
S4_TITEL = "Step 4: input for consumption and programme values"
S5_TEXT = "Only needed if Loxone should trigger something. In Loxone Config create a <i>virtual output</i> with the address below and one <i>virtual output command</i> per command. In the command text <span class='sm-mono'>&lt;v&gt;</span> stands for the value passed."
S5_TITEL = "Step 5: sending commands (virtual output)"
S5_WARNUNG = "Two things to know beforehand. <b>First:</b> write commands are disabled by default and must be enabled in the Settings tab. <b>Second:</b> an answer of <span class='sm-mono'>OK=1</span> means the provider accepted the request. Whether the appliance actually starts only shows on the next poll &mdash; if you need certainty, evaluate <span class='sm-mono'>LAEUFT</span>, not the answer to the command."
S6_TEXT = "The endpoint sits in the unauthenticated area so Loxone can reach it without credentials. It is protected by this token. The token is part of every address you enter in the Miniserver &mdash; <b>a new token invalidates all of them at once</b> and has to be updated everywhere. So only roll a new one if it has actually leaked."
S6_TITEL = "Step 6: the token"
S7_TEXT = "If a provider goes silent, the virtual inputs keep their last value. Everything looks normal in the app although nothing has arrived for hours. That is why the value <span class='sm-mono'>ALTER</span> is carried along: it states the age of the snapshot in seconds. Set the threshold <b>well above the idle interval</b> &mdash; with 300 seconds, 1200 works well."
S7_TITEL = "Step 7: failure detection"
S8_ERLAEUTERUNG = "<p><b>On #13 to #16 &mdash; the actual purpose:</b> threshold switch #13 compares the PV surplus with what the machine draws (washing machine about 2000 W, dishwasher about 2200 W while heating). The AND at #14 only allows the start if the remote start release is present and the appliance is not already running. The ten minute on-delay at #15 prevents a passing cloud from triggering a wash programme.</p><p><b>On #17 and #18:</b> both optional. With a house battery you do not want to wash while it is empty; with a dynamic tariff you may want to wash without sun when electricity is cheap. Both blocks come from other plugins &mdash; this one does not supply them.</p><p><b>On #21 and #22:</b> the notification block only fires on a change from off to on &mdash; exactly right for 'the dishwasher has finished'. Never wire several appliances straight to its input: one permanently active source swallows all the others. Combine them with an OR first.</p><p><b>On #25:</b> the threshold is four times the idle interval. Set it tighter and every single missed cycle raises an alarm.</p><p><b>On #30:</b> without the remote start release the provider rejects every start. Not sending the command at all saves an error message and a request. <b>Loxone time base:</b> seconds since 1 January 2009. If a time block supplies Unix time (values around 1.23 billion), subtract 1230768000.</p>"
S8_TEXT = "One block per row. Loxone Config lists them all in the block search (key F5). Rows 1 to 12 are the virtual inputs from steps 3 and 4. What is rebuilt is the case most people are after: <b>wash when the sun is shining</b> &mdash; plus a message when the programme has finished."
S8_TITEL = "Step 8: complete block list for rebuilding one to one"
S9_TEXT = "Open these three addresses in a browser. The first must return values, the other two must be <b>rejected</b> &mdash; if they are not, something is wrong with the protection."
S9_TITEL = "Step 9: cross-check"
