STEUERUNG_ERKLAERUNG = "<b>Disabled by default.</b> Write commands start and stop real machines in an empty house. A wash programme started by accident runs without anyone having loaded laundry; an aborted one leaves it wet in the drum. Only enable this once the read values in the Test tab look right. <b>Two safeguards remain anyway:</b> the appliance must have the remote start release — given on the appliance itself, and usually cleared after the programme — and a programme must be selected there."
