ST_WARNUNG = "<b>Reservation.</b> On 30 December 2024 Samsung cut the lifetime of newly issued personal access tokens to <b>24 hours</b> and lowered the rate limits. For continuous operation Samsung requires a registered application with a publicly reachable webhook — which a LoxBerry behind a router cannot easily provide. In practice: <b>you have to renew the token every day.</b> If you do not want to live with that, leave SmartThings switched off. Tokens issued before 30 December 2024 are not affected."
TAKT_ERKLAERUNG = "<b>The actual reason for this plugin.</b> A fixed polling cycle is either too slow for a useful remaining time or too fast for the provider's rate limits. Here there are two intervals: a wide one while nothing is running and a tight one as soon as at least one appliance is working. Switching happens automatically."
