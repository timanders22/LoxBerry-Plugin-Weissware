WAS_IST_DAS = "<b>Connects networked home appliances of three ecosystems to Loxone and brings them onto one common model</b> – Home Connect (Bosch, Siemens, Neff, Gaggenau, Constructa), Miele and Samsung SmartThings. A polling service on the LoxBerry fetches the values from the vendor clouds at the configured interval and stores them; the Miniserver reads them over MQTT or the HTTP endpoint of the plugin. Write commands to the appliances are blocked by default. On request the plugin announces through the shared speech output when an appliance has finished (off by default)."

