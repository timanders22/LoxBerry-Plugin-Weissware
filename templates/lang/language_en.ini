RETAIN_ERKLAERUNG = "<b>Retain</b> means the broker keeps the last value and hands it to every new subscriber at once. After a restart of the Miniserver or the gateway those values are therefore back immediately. Device states are retained, measurements tied to a point in time are not, statements about the service itself (sign of life, ok, failed attempts, outages) never — otherwise a dead service would look healthy after a restart — a remaining time of 60 minutes, kept for a week, would be a quiet false statement. An empty value is never retained, because an empty payload deletes the topic in the broker."
